<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090d" />
    <title>Corner Call</title>
    <link rel="stylesheet" href="src/styles.css" />
    <script defer src="src/main.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="trainer" aria-labelledby="app-title">
        <header class="topbar">
          <div>
            <p class="eyebrow">Heavy bag rounds</p>
            <h1 id="app-title">Corner Call</h1>
          </div>
          <div class="round-pill" aria-live="polite">
            <span id="phaseLabel">Ready</span>
            <strong id="roundLabel">Round 1</strong>
          </div>
        </header>

        <div class="timer-stage" aria-live="polite">
          <div class="timer-ring" id="timerRing">
            <span id="timeRemaining">03:00</span>
            <small id="timerHint">Pick a format and tap Start</small>
          </div>
          <div class="combo-callout">
            <p>Next call</p>
            <strong id="currentCombo">1 - 2 - 1 - 2</strong>
            <span id="comboNames">jab, cross, jab, cross</span>
          </div>
        </div>

        <div class="controls" role="group" aria-label="Workout controls">
          <button class="primary" id="startPauseButton" type="button">Start</button>
          <button id="skipButton" type="button">Skip combo</button>
          <button id="resetButton" type="button">Reset</button>
        </div>
      </section>

      <section class="settings-grid" aria-label="Workout settings">
        <section class="panel">
          <div class="panel-heading">
            <h2>Round Format</h2>
            <span id="formatSummary">5 x 3:00</span>
          </div>
          <div class="preset-grid" id="presetGrid"></div>
          <div class="custom-grid">
            <label>
              Rounds
              <input id="roundsInput" min="1" max="15" type="number" />
            </label>
            <label>
              Round min
              <input id="roundMinutesInput" min="1" max="12" type="number" />
            </label>
            <label>
              Rest sec
              <input id="restSecondsInput" min="15" max="180" step="5" type="number" />
            </label>
          </div>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <h2>Combo Engine</h2>
            <span id="engineSummary">Every 4 sec</span>
          </div>
          <label class="range-row">
            <span>Call pace</span>
            <input id="paceInput" min="2" max="9" type="range" />
            <strong id="paceValue">4s</strong>
          </label>
          <label class="range-row">
            <span>Combo length</span>
            <input id="comboLengthInput" min="2" max="6" type="range" />
            <strong id="comboLengthValue">4</strong>
          </label>
          <div class="toggle-row">
            <label>
              <input id="defenseToggle" type="checkbox" />
              Defensive moves
            </label>
            <label>
              <input id="voiceToggle" type="checkbox" />
              Voice calls
            </label>
          </div>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <h2>Coach Notes</h2>
            <span id="comboCount">0 calls</span>
          </div>
          <ol class="recent-list" id="recentCombos" aria-label="Recent combinations"></ol>
        </section>

        <section class="panel punch-panel">
          <div class="panel-heading">
            <h2>Punch Key</h2>
            <span>Orthodox numbers</span>
          </div>
          <div class="punch-grid" id="punchGrid"></div>
        </section>
      </section>
    </main>
  </body>
</html>
